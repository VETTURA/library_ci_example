name: Lint and Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run black
        run: black --diff --config configs/pyproject.toml .

      - name: Run flake8
        run: flake8 --config=configs/.flake8 .

      - name: Run mypy
        run: mypy --config-file=configs/mypy.ini .

      - name: Run tests with coverage
        run: pytest --cov=library --cov-report=term
